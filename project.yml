# XcodeGen spec for the Darkroom family: `xcodegen generate` -> Darkroom.xcodeproj
name: Darkroom
options:
  bundleIdPrefix: com.giacomoancora
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Darkroom:
    path: .
  DarkroomKit:
    path: Packages/DarkroomKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal builds for this Mac: ad-hoc signed, no sandbox, so sidecars can be written next to the photos.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Giacomo Ancora. Free software under the GNU GPL v3."
targets:
  Negatives:
    type: application
    platform: macOS
    sources:
      - Apps/Negatives
    dependencies:
      - package: Darkroom
        product: NegativesCore
      - package: DarkroomKit
        product: DarkroomUI
    settings:
      base:
        PRODUCT_NAME: Negatives
        PRODUCT_BUNDLE_IDENTIFIER: com.giacomoancora.negatives
        INFOPLIST_KEY_CFBundleDisplayName: Negatives
  Positives:
    type: application
    platform: macOS
    sources:
      - Apps/Positives
    dependencies:
      - package: Darkroom
        product: PositivesCore
      - package: DarkroomKit
        product: DarkroomUI
    settings:
      base:
        PRODUCT_NAME: "Positives - photo editor"
        PRODUCT_MODULE_NAME: Positives
        PRODUCT_BUNDLE_IDENTIFIER: com.giacomoancora.positives
        INFOPLIST_KEY_CFBundleDisplayName: "Positives - photo editor"
